[package]
name = "open-msu2-mini"
version = "1.1.1"
edition = "2021"
description = "Open-source driver and control app for the MSU2 / MSU2_MINI 160x80 USB screen"
license = "MIT"
repository = "https://github.com/TomTheDragon/Open-MSU2_MINI"
readme = "README.md"
keywords = ["msu2", "usb-display", "lcd", "screen-mirroring", "ch32x035"]
categories = ["hardware-support", "gui"]
rust-version = "1.95"
exclude = ["/build", "/dist", "/.github"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
serialport = "4.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
imageproc = { version = "0.27", default-features = false, features = ["text"] }
ab_glyph = "0.2"
fast_image_resize = "6"
sysinfo = "0.40"
chrono = "0.4"
# appindicator: tray icon via StatusNotifier (KDE, GNOME + extension, Wayland); Linux only
wxdragon = { version = "0.9", optional = true, default-features = false, features = ["appindicator"] }
cpal = "0.18"

[features]
default = ["gui"]
gui = ["dep:wxdragon"]

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
pipewire = "0.10"
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Power"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9"
# video mode (Linux uses the system's ffmpeg instead): MP4 container, H.264 and sound decoders
mp4 = "0.14"
openh264 = "0.9"
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "flac", "vorbis", "mkv", "wav", "ogg", "adpcm"] }

[build-dependencies]
embed-manifest = "1.4"
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
