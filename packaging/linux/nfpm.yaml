# Linux packages (deb, rpm, Arch) from the release executable; see build/package.sh.
name: open-msu2-mini
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: utils
priority: optional
maintainer: TomTheDragon <7361323+TomTheDragon@users.noreply.github.com>
description: |
  Driver and control app for the MSU2 / MSU2_MINI 160x80 USB screen.
  Screen mirroring, system monitor, clock, pictures, GIFs and videos.
vendor: Open MSU2_MINI
homepage: https://github.com/TomTheDragon/Open-MSU2_MINI
license: MIT

contents:
  - src: target/package/open-msu2-mini
    dst: /usr/bin/open-msu2-mini
    file_info: { mode: 0755 }
  - src: target/package/open-msu2-mini.desktop
    dst: /usr/share/applications/open-msu2-mini.desktop
  - src: assets/icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/open-msu2-mini.svg
  - src: packaging/linux/70-open-msu2-mini.rules
    dst: /usr/lib/udev/rules.d/70-open-msu2-mini.rules
  - src: LICENSE
    dst: /usr/share/licenses/open-msu2-mini/LICENSE
  - src: README.md
    dst: /usr/share/doc/open-msu2-mini/README.md

scripts:
  postinstall: packaging/linux/postinstall.sh
  postremove: packaging/linux/postinstall.sh

# Runtime libraries, tested in clean containers (see "Install" in README.md).
overrides:
  deb: # Ubuntu 24.04+, Debian 13+
    depends:
      - libc6 (>= 2.39)
      - libgtk-3-0t64 | libgtk-3-0
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libayatana-appindicator3-1
      - libasound2t64 | libasound2
      - libsm6
      - libudev1
    recommends:
      - ffmpeg
  rpm: # Fedora and openSUSE: library names, the package names differ between the two
    depends:
      - libc.so.6(GLIBC_2.39)(64bit)
      - libgtk-3.so.0()(64bit)
      - libpipewire-0.3.so.0()(64bit)
      - libayatana-appindicator3.so.1()(64bit)
      - libasound.so.2()(64bit)
      - libSM.so.6()(64bit)
      - libudev.so.1()(64bit)
    recommends:
      # each one is optional: Fedora has ffmpeg-free (RPM Fusion: ffmpeg), openSUSE ffmpeg
      - ffmpeg-free
      - ffmpeg
  archlinux:
    depends:
      - glibc
      - gtk3
      - libpipewire
      - libayatana-appindicator
      - alsa-lib
      - libsm
      - systemd-libs
    suggests:
      - "ffmpeg: video mode"
