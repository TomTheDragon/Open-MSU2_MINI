name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, file: open-msu2-mini, asset: open-msu2-mini-linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, file: open-msu2-mini.exe, asset: open-msu2-mini-windows-x86_64.exe }
          - { os: macos-15, target: aarch64-apple-darwin, file: open-msu2-mini, asset: open-msu2-mini-macos-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, file: open-msu2-mini, asset: open-msu2-mini-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libclang-dev pkg-config libgtk-3-dev \
            libpipewire-0.3-dev libayatana-appindicator3-dev libudev-dev libasound2-dev libxkbcommon-dev libgl1-mesa-dev libglu1-mesa-dev libssl-dev
      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Windows build tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Windows packages
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.file }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Linux packages (deb, rpm, Arch)
        if: runner.os == 'Linux'
        run: build/package.sh ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: open-msu2-mini*
